name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate content, saves, assets, and procedural systems
        run: node tests/run.mjs
      - name: Assemble runtime-only Pages site
        run: |
          mkdir -p _site/assets _site/assets/audio
          cp index.html site.webmanifest _site/
          cp -R css js _site/
          cp -R assets/icons assets/images assets/monsters _site/assets/
          cp -R assets/audio/music _site/assets/audio/
          test -f _site/js/app.js
          test -f _site/assets/images/town/the-hole-colored.png
          test -f _site/assets/audio/music/battle-theme.mp3
          test ! -d _site/assets/source
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
